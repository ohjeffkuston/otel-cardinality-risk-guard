name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Validate sample (expected fail-closed)
        run: |
          set +e
          cardinality-guard examples/telemetry-inventory.json --output report.json --ai-context ai-context.json
          test "$?" -eq 2
          test "$(python -c 'import json; print(json.load(open("report.json"))["release_decision"])')" = "block"

