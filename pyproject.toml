[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "otel-cardinality-risk-guard"
version = "0.1.0"
description = "Deterministic pre-deployment telemetry cardinality risk analysis for OpenTelemetry pipelines"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cardinality-guard = "cardinality_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

